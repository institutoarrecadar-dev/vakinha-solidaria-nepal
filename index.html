<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAKINHA SOLIDÁRIA DO NEPAL</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f7;
  color:#252525
}

header{
  background:#16a34a;
  color:#fff;
  padding:18px 20px;
  box-shadow:0 2px 8px #0002
}

.logo{
  max-width:1050px;
  margin:auto;
  font-size:30px;
  font-weight:800
}

.container{
  max-width:1050px;
  margin:25px auto;
  padding:0 15px
}

.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 3px 15px #0001;
  padding:20px;
  margin-bottom:20px
}

.hero-img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-radius:12px;
  background:#e5e7eb;
  display:block
}

h1{
  font-size:28px;
  margin:20px 0 10px
}

.campaign-text{
  font-size:17px;
  line-height:1.6;
  white-space:pre-wrap
}

.stats{
  display:flex;
  gap:15px;
  margin:20px 0
}

.stat{
  flex:1;
  background:#f0fdf4;
  border-radius:10px;
  padding:15px
}

.stat small{
  display:block;
  color:#666;
  margin-bottom:5px
}

.stat strong{
  font-size:23px;
  color:#15803d
}

.progress{
  height:14px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden
}

.progress-bar{
  height:100%;
  width:0;
  background:#16a34a;
  transition:.3s
}

.donation-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0
}

.amount{
  border:2px solid #d1d5db;
  background:#fff;
  padding:15px;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}

.amount:hover,
.amount.active{
  border-color:#16a34a;
  background:#f0fdf4;
  color:#15803d
}

.custom{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px
}

.donate{
  width:100%;
  margin-top:14px;
  border:0;
  background:#16a34a;
  color:white;
  font-size:19px;
  font-weight:bold;
  padding:16px;
  border-radius:9px;
  cursor:pointer
}

.donate:hover{
  background:#15803d
}

#paymentStatus{
  display:none
}

@media(max-width:650px){
  .hero-img{height:230px}
  .stats{flex-direction:column}
  .donation-grid{grid-template-columns:repeat(2,1fr)}
  h1{font-size:24px}
}
</style>
</head>

<body>

<header>
  <div class="logo">VAKINHA SOLIDÁRIA DO NEPAL</div>
</header>

<main class="container">

<section class="card">

  <img id="campaignImage"
       class="hero-img"
       alt="Imagem da campanha">

  <h1 id="campaignTitle"></h1>

  <div id="campaignText" class="campaign-text"></div>

  <video id="campaignVideo"
         controls
         playsinline
         style="display:none;width:100%;max-height:520px;margin:18px 0;border-radius:12px;background:#000">
  </video>

  <div class="stats">

    <div class="stat">
      <small>Arrecadado</small>
      <strong id="raised">R$ 0,00</strong>
    </div>

    <div class="stat">
      <small>Meta</small>
      <strong id="goal">R$ 0,00</strong>
    </div>

  </div>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <h2>Escolha o valor da doação</h2>

  <div class="donation-grid">

    <button class="amount" data-value="50">
      R$ 50
    </button>

    <button class="amount" data-value="100">
      R$ 100
    </button>

    <button class="amount" data-value="200">
      R$ 200
    </button>

    <button class="amount" data-value="350">
      R$ 350
    </button>

    <button class="amount" data-value="500">
      R$ 500
    </button>

    <button class="amount" data-value="750">
      R$ 750
    </button>

  </div>

  <input
    id="customAmount"
    class="custom"
    type="number"
    min="1"
    step="0.01"
    placeholder="Ou digite outro valor (R$)"
  >

  <button id="donateButton" class="donate">
    DOAR AGORA
  </button>

  <!-- Mantido para o funcionamento do Gateway, mas não aparece na página -->
  <div id="paymentStatus"></div>

</section>

</main>

<script>

const DEFAULTS = {
  title: "VAKINHA SOLIDÁRIA DO NEPAL",
  image: "",
  text: "",
  extra: "",
  video: "",
  raised: 0,
  goal: 10000,
  gatewayUrl: "",
  infiniteTag: "",
  gatewayProvider: "infinitepay"
};

let config = {...DEFAULTS};

let selectedAmount = null;


/* Carrega os dados salvos pelo painel administrativo */
async function carregarConfiguracao(){

  try{

    const resposta = await fetch("/api/config", {
      cache:"no-store"
    });

    if(resposta.ok){

      const dados = await resposta.json();

      config = {
        ...DEFAULTS,
        ...dados
      };

    }

  }catch(erro){

    console.log("Não foi possível carregar a configuração do servidor.");

  }

  render();

}


/* Formatação de dinheiro */
function money(valor){

  return Number(valor || 0).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* Mostra os dados da campanha */
function render(){

  document.getElementById("campaignTitle").textContent =
    config.title || DEFAULTS.title;


  document.getElementById("campaignText").textContent =
    config.text || "";


  document.getElementById("raised").textContent =
    money(config.raised);


  document.getElementById("goal").textContent =
    money(config.goal);


  const meta = Number(config.goal) || 0;

  const arrecadado = Number(config.raised) || 0;

  const porcentagem =
    meta > 0
      ? Math.min(100, Math.max(0,(arrecadado/meta)*100))
      : 0;


  document.getElementById("progressBar").style.width =
    porcentagem + "%";


  const imagem =
    document.getElementById("campaignImage");


  if(config.image){

    imagem.src = config.image;
    imagem.style.display = "block";

  }else{

    imagem.removeAttribute("src");
    imagem.style.display = "block";

  }


  const video =
    document.getElementById("campaignVideo");


  if(config.video){

    video.src = config.video;
    video.style.display = "block";

  }else{

    video.removeAttribute("src");
    video.style.display = "none";

  }

}


/* Botões de valores */
document.querySelectorAll(".amount").forEach(botao => {

  botao.addEventListener("click",() => {

    document
      .querySelectorAll(".amount")
      .forEach(b => b.classList.remove("active"));

    botao.classList.add("active");

    selectedAmount =
      Number(botao.dataset.value);

    document.getElementById("customAmount").value = "";

  });

});


/* Valor personalizado */
document
  .getElementById("customAmount")
  .addEventListener("input",() => {

    selectedAmount = null;

    document
      .querySelectorAll(".amount")
      .forEach(b => b.classList.remove("active"));

  });


/* Gateway */
document
  .getElementById("donateButton")
  .addEventListener("click",async() => {

    const valorDigitado =
      Number(
        document.getElementById("customAmount").value
      );

    const amount =
      valorDigitado > 0
        ? valorDigitado
        : selectedAmount;


    if(!amount || amount <= 0){

      alert("Escolha ou digite um valor para doar.");

      return;

    }


    const status =
      document.getElementById("paymentStatus");


    /*
      O Gateway continua no código.
      A URL é fornecida pela configuração do servidor.
    */

    if(!config.gatewayUrl){

      alert("Gateway de pagamento ainda não configurado.");

      return;

    }


    try{

      const resposta =
        await fetch(
          config.gatewayUrl,
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({

              amount:amount,

              currency:"BRL",

              campaign:
                config.title,

              returnUrl:
                window.location.href

            })

          }
        );


      if(!resposta.ok){

        throw new Error(
          "Falha no Gateway"
        );

      }


      const dados =
        await resposta.json();


      if(dados.checkout_url){

        window.location.href =
          dados.checkout_url;

        return;

      }


      if(dados.payment_url){

        window.location.href =
          dados.payment_url;

        return;

      }


      status.textContent =
        "Pagamento criado.";

    }catch(erro){

      console.error(erro);

      alert(
        "Não foi possível iniciar o pagamento."
      );

    }

  });


/* Inicia a página */
carregarConfiguracao();

</script>

</body>
</html>
